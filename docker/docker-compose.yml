services:
  ownbase:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    ports:
      - "8543:8543"
    volumes:
      - ownbase-data:/data
    command: ["--name", "My Workspace", "--invite-only"]
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      OWNBASE_ICE_SERVERS: ${OWNBASE_ICE_SERVERS:-[]}
      # Your own TURN relay sharing a secret with the server (coturn's
      # use-auth-secret): both, or neither.
      OWNBASE_TURN_URLS: ${OWNBASE_TURN_URLS:-}
      OWNBASE_TURN_SECRET: ${OWNBASE_TURN_SECRET:-}
      # A Cloudflare TURN relay for calls between networks: both, or neither.
      OWNBASE_CLOUDFLARE_TURN_KEY_ID: ${OWNBASE_CLOUDFLARE_TURN_KEY_ID:-}
      OWNBASE_CLOUDFLARE_TURN_API_TOKEN: ${OWNBASE_CLOUDFLARE_TURN_API_TOKEN:-}

volumes:
  ownbase-data:
