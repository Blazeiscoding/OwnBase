name: Atlas
# Rebuilds the project atlas, docs/PROJECT-VISUALIZER.html, after every push to
# main and commits it there when it changed, so the copy in the repository
# follows the code and a pull request need not rebuild it. The page embeds
# every tracked file, so any change can change it.
#
# A file of app code nobody has written an explanation for yet is explained
# from its own comments, and the page says so; the checks job names the ones a
# pull request adds. A broken atlas input, such as an explanation of a file
# that no longer exists, fails the pull request's checks before it gets here.
#
# Its commit is pushed with the workflow's own token, which starts no other
# workflow, and [skip ci] keeps Cloudflare Pages from redeploying the
# unchanged landing page for it.
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  # Only the newest commit's atlas matters; a run for an older one stops.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  rebuild:
    # A fork's main is its own to keep.
    if: ${{ !github.event.repository.fork }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      # The generator parses with TypeScript and embeds the web app's fonts.
      - run: pnpm install --frozen-lockfile
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: 1
      - name: Check whether the atlas follows this commit
        id: check
        run: |
          if pnpm --silent visualizer:check; then
            echo "stale=false" >> "$GITHUB_OUTPUT"
          else
            echo "stale=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Rebuild the atlas
        if: steps.check.outputs.stale == 'true'
        run: pnpm --silent visualizer:build | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Commit it to ${{ github.ref_name }}
        if: steps.check.outputs.stale == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add docs/PROJECT-VISUALIZER.html
          git commit --quiet -m "docs(atlas): rebuild for ${GITHUB_SHA::7} [skip ci]"
          if git push origin "HEAD:$GITHUB_REF_NAME"; then exit 0; fi
          # A newer commit landed while this ran: its own run rebuilds the atlas.
          git fetch --quiet origin "$GITHUB_REF_NAME"
          if [ "$(git rev-parse FETCH_HEAD)" != "$GITHUB_SHA" ]; then
            echo "::notice::$GITHUB_REF_NAME moved on while this ran; the run for its newest commit rebuilds the atlas."
            exit 0
          fi
          exit 1
