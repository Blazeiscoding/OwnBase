name: Atlas
# After every push to main, rebuilds the two pages generated from the
# repository:
#
# - the project atlas, from every tracked file. It is 17 MB and any change can
#   change it, so it is not committed: each run uploads it to
#   https://dl.ownbase.site/atlas/index.html, the R2 bucket the downloads use,
#   overwriting the one before. `pnpm visualizer:build` makes a local copy at
#   docs/PROJECT-VISUALIZER.html, which git ignores.
# - the docs at ownbase.site/docs, apps/site/docs, and the site's sitemap, from
#   docs/DEPLOYMENT.md and docs/INTEGRATIONS.md by
#   scripts/generate-docs-site.mjs. They change with the guides, the generator,
#   and the site's style sheets and script, and are committed to main when they
#   changed, so a pull request need not rebuild them.
#
# A file of app code nobody has written an explanation for yet is explained
# from its own comments, and the page says so; the checks job names the ones a
# pull request adds. A broken atlas input, such as an explanation of a file
# that no longer exists, fails the pull request's checks before it gets here,
# as does Markdown the docs generator cannot show.
#
# The docs commit is pushed with the workflow's own token, which starts no run
# of this or any other workflow, so it cannot loop. It carries no [skip ci],
# because Cloudflare Pages skips deploying a push whose newest commit says
# [skip ci], and the docs must deploy.
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  # Only the newest commit's pages matter; a run for an older one stops.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  rebuild:
    # A fork's main is its own to keep.
    if: ${{ !github.event.repository.fork }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      # The atlas generator parses with TypeScript and embeds the web app's
      # fonts. The docs generator needs nothing installed.
      - run: pnpm install --frozen-lockfile
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: 1
      - name: Check whether the docs pages follow this commit
        id: docs
        run: |
          if pnpm --silent docs:check; then
            echo "stale=false" >> "$GITHUB_OUTPUT"
          else
            echo "stale=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Rebuild the atlas
        run: pnpm --silent visualizer:build | tee -a "$GITHUB_STEP_SUMMARY"
      # The same bucket and keys as the release's downloads. The release's
      # clean-up removes only folders named for a version (v...), never atlas/.
      # R2 does not answer a folder's address with its index.html, so links
      # name the file.
      - name: Publish the atlas
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_DOWNLOADS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_DOWNLOADS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          # R2 does not take the newer CLI's default checksums.
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
          ENDPOINT: https://35d320dcda363c47cabe859d44e84243.r2.cloudflarestorage.com
          BUCKET: ownbase-downloads
        run: |
          if [ -z "$AWS_ACCESS_KEY_ID" ]; then
            echo "::notice::No R2 keys, so the atlas at dl.ownbase.site is the one before."
            exit 0
          fi
          s3() { aws s3 --endpoint-url "$ENDPOINT" "$@"; }
          s3 cp docs/PROJECT-VISUALIZER.html "s3://$BUCKET/atlas/index.html" --only-show-errors \
            --content-type "text/html; charset=utf-8" --cache-control "public, max-age=300"
          echo "https://dl.ownbase.site/atlas/index.html is the atlas for ${GITHUB_SHA::7}" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Rebuild the docs pages
        if: steps.docs.outputs.stale == 'true'
        run: pnpm --silent docs:build | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Commit the docs pages to ${{ github.ref_name }}
        if: steps.docs.outputs.stale == 'true'
        env:
          DOCS_STALE: ${{ steps.docs.outputs.stale }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          if [ "$DOCS_STALE" = "true" ]; then
            # -A: a section renamed or removed leaves a page to delete.
            git add -A apps/site/docs apps/site/sitemap.xml
            git commit --quiet -m "docs(site): rebuild the docs pages for ${GITHUB_SHA::7}"
          fi
          if git push origin "HEAD:$GITHUB_REF_NAME"; then exit 0; fi
          # A newer commit landed while this ran: its own run rebuilds the pages.
          git fetch --quiet origin "$GITHUB_REF_NAME"
          if [ "$(git rev-parse FETCH_HEAD)" != "$GITHUB_SHA" ]; then
            echo "::notice::$GITHUB_REF_NAME moved on while this ran; the run for its newest commit rebuilds the pages."
            exit 0
          fi
          exit 1
