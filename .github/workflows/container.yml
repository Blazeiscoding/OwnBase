name: Container
# Building the image and starting it took half a minute of every check run,
# and it includes both the server and web client. Run it when either artifact,
# their shared dependencies, or the image's own inputs change. The smoke test
# needs Docker and Node only. It builds for linux/amd64 and linux/arm64 as a
# release does (.github/actions/container-image), and pushes nothing.
on:
  pull_request:
    paths:
      - "docker/**"
      - ".dockerignore"
      - "apps/server-cli/**"
      - "apps/web/**"
      - "packages/server/**"
      - "packages/protocol/**"
      - "packages/client-core/**"
      - "packages/ui/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "package.json"
      - ".npmrc"
      - ".pnpmfile.cjs"
      - "tsconfig.base.json"
      - "tests/docker-smoke.mjs"
      - "tests/docker-reuse.mjs"
      - "scripts/build-identity.mjs"
      - ".github/actions/container-image/**"
      - ".github/workflows/container.yml"
      - "!**/*.md"
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: ./.github/actions/container-image
