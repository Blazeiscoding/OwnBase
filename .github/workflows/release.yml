name: Release
# A release is built and tested from one commit, then published as a draft
# with the SHA-256 of every file and the revision each was built from
# (IMP-08). It runs on a version tag, or by hand with the tag to create,
# and leaves a draft for someone to publish. Every change to the app merged
# to main is released too, as the next alpha of package.json's version
# (v0.2.0-alpha.4 after v0.2.0-alpha.3), and published at once, so the
# website's download buttons, which offer the newest published release,
# offer it within minutes.
# Published files are release assets, not Actions artifacts, so the checks'
# artifact clean-up (ci.yml) cannot delete them; the artifacts carrying them
# between these jobs are named release-*, which the clean-up leaves alone.
# A pull request that changes the release itself runs everything but the
# publishing, so the gates are proved before a real release depends on them.
on:
  push:
    tags: ["v*"]
    branches: [main]
    # What is in the installer, the disk image or the server. GitHub does not
    # read paths for a tag, so a version tag still releases whatever changed.
    paths:
      - "apps/desktop/**"
      - "apps/server-cli/**"
      - "apps/web/**"
      - "packages/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "!**/test/**"
      - "!**/*.test.*"
      - "!**/*.md"
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to release (v1.2.3 or v1.2.3-rc.1), created at this commit when published
        required: true
        type: string
  pull_request:
    paths:
      - ".github/workflows/release.yml"
      - ".github/actions/**"
      - "scripts/release-*"
# Releases from main wait their turn rather than cancel one another: a run
# stopped while publishing could leave a release with half its files. Of the
# merges that pile up meanwhile, GitHub keeps only the newest waiting, so a
# burst of merges is released once, from the last of them.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
jobs:
  # Publishing a draft by hand creates its tag, and a version tag starts this
  # workflow, which would build the same release again and leave a second
  # draft of it. A tag whose release is already out builds nothing.
  # The tag is chosen here, before anything is built, because every build
  # carries it as its version: the installed app compares versions to know
  # whether a release is newer than itself.
  plan:
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.check.outputs.build }}
      tag: ${{ steps.tag.outputs.tag }}
      version: ${{ steps.tag.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - name: Choose the tag
        id: tag
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          version=$(node -p "require('./package.json').version")
          if [ -n "$INPUT_TAG" ]; then tag="$INPUT_TAG"
          elif [ "$GITHUB_REF_TYPE" = "tag" ]; then tag="$GITHUB_REF_NAME"
          elif [ "$GITHUB_EVENT_NAME" = "push" ]; then
            # The next alpha after every one tagged so far. A draft has no tag
            # until it is published, so a draft left waiting may share its name.
            # Runs from main queue one at a time, so two cannot pick one number.
            last=$(git ls-remote --tags origin "refs/tags/v$version-alpha.*" \
              | grep -oE -- '-alpha\.[0-9]+$' | grep -oE '[0-9]+$' | sort -n | tail -1) || true
            tag="v$version-alpha.$(( ${last:-0} + 1 ))"
          else tag="v$version-check"; fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"
          echo "Building $tag"
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          build=true
          if [ "$GITHUB_REF_TYPE" = "tag" ] &&
            gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json isDraft --jq '.isDraft' 2>/dev/null | grep -qx false; then
            echo "::notice::$GITHUB_REF_NAME is already released, so there is nothing to build."
            build=false
          fi
          echo "build=$build" >> "$GITHUB_OUTPUT"

  # The server is built and packed here, and tested beside it: the unit
  # suites in the parts ci.yml splits them into, and the browser suite in
  # three parts that each unpack this very archive. In one job, one after
  # another, these took 11 to 14 minutes, the longest wait of a release.
  server:
    needs: [plan]
    if: needs.plan.outputs.build == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: 1
      - run: pnpm build --concurrency=2
        env:
          OWNBASE_VERSION: ${{ needs.plan.outputs.version }}
      - run: node scripts/check-web-bundle.mjs
      - run: node scripts/check-web-precompressed.mjs apps/server-cli/dist/web
      - name: Collect the server
        env:
          version: ${{ needs.plan.outputs.version }}
        run: |
          mkdir -p release
          tar -czf "release/ownbase-server-$version.tar.gz" -C apps/server-cli/dist .
          cp apps/server-cli/dist/build.json release/server.build.json
          cp apps/server-cli/dist/web/build.json release/web.build.json
          # What the browser jobs test, bound by SHA-256 here, where it was built.
          node scripts/release-manifest.mjs bind release server "release/ownbase-server-$version.tar.gz"
      - uses: actions/upload-artifact@v7
        with:
          name: release-server
          path: release/
          retention-days: 1

  unit:
    name: unit (${{ matrix.part }})
    needs: [plan]
    if: needs.plan.outputs.build == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - part: typecheck and the rest
            run: >-
              pnpm typecheck --concurrency=2 &&
              pnpm exec turbo run test --filter=@ownbase/protocol --filter=@ownbase/client-core
              --filter=@ownbase/desktop --filter=@ownbase/ee --filter=@ownbase/cloud --concurrency=2
          - part: server
            run: pnpm exec turbo run test --filter=@ownbase/server --only
          - part: ui 1 of 2
            run: pnpm exec turbo run test --filter=@ownbase/ui --only -- --shard=1/2
          - part: ui 2 of 2
            run: pnpm exec turbo run test --filter=@ownbase/ui --only -- --shard=2/2
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: 1
      - run: ${{ matrix.run }}
        env:
          VITEST_MAX_WORKERS: "2"

  browser:
    name: browser (e2e ${{ matrix.shard }} of 3)
    needs: [server]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: 1
      - uses: actions/download-artifact@v8
        with:
          name: release-server
          path: release
      # The archive the release publishes, where the tests start it from.
      # Their setup refuses anything not built from this checkout.
      - name: Unpack the server
        run: |
          mkdir -p apps/server-cli/dist
          tar -xzf release/ownbase-server-*.tar.gz -C apps/server-cli/dist
      - uses: ./.github/actions/chromium
      - run: pnpm test:e2e --shard=${{ matrix.shard }}/3

  windows:
    needs: [plan]
    if: needs.plan.outputs.build == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - name: Cache Electron and packaging tools
        uses: actions/cache@v6
        with:
          path: |
            ~/AppData/Local/electron/Cache
            ~/AppData/Local/electron-builder/Cache
          key: electron-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            electron-${{ runner.os }}-${{ runner.arch }}-
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck:automation
      # The release's version is the installed app's own (extraMetadata), set
      # here rather than in package.json, which would make the build "dirty".
      # electron-builder writes the update feed but publishes nothing; the
      # publish job does.
      - run: pnpm --filter @ownbase/desktop package --win --publish never "-c.extraMetadata.version=$env:OWNBASE_VERSION"
        env:
          OWNBASE_VERSION: ${{ needs.plan.outputs.version }}
      - run: node scripts/check-web-bundle.mjs apps/desktop/out/renderer
      - run: node scripts/check-desktop-archive.mjs apps/desktop/release/win-unpacked/resources/app.asar
      - run: node scripts/check-web-precompressed.mjs apps/desktop/release/win-unpacked/resources/web
      - run: pnpm test:desktop
      # The previous published release, if there is one, to upgrade from.
      - name: Fetch the previous release
        id: previous
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = gh release list --exclude-drafts --limit 1 --json tagName --jq '.[0].tagName'
          if ($tag) {
            gh release download $tag --pattern "*Setup*.exe" --dir previous
            $installer = (Get-ChildItem "previous/*Setup*.exe" | Select-Object -First 1).FullName
            "installer=$installer" >> $env:GITHUB_OUTPUT
          }
      - name: Install, upgrade and uninstall gates
        shell: pwsh
        env:
          PREVIOUS: ${{ steps.previous.outputs.installer }}
          OWNBASE_VERSION: ${{ needs.plan.outputs.version }}
        run: |
          $version = $env:OWNBASE_VERSION
          $installer = (Get-ChildItem "apps/desktop/release/*Setup*.exe" | Select-Object -First 1).FullName
          $previous = $env:PREVIOUS
          if ($previous) {
            ./scripts/release-install-gates.ps1 -Installer $installer -Version $version -Revision $env:GITHUB_SHA -Previous $previous
          } else {
            ./scripts/release-install-gates.ps1 -Installer $installer -Version $version -Revision $env:GITHUB_SHA
          }
      - name: Collect the installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release | Out-Null
          Copy-Item (Get-ChildItem "apps/desktop/release/*Setup*.exe" | Select-Object -First 1).FullName release/
          # The feed the installed app updates from, and the installer's block map.
          Copy-Item apps/desktop/release/latest.yml release/
          Copy-Item (Get-ChildItem "apps/desktop/release/*Setup*.exe.blockmap" | Select-Object -First 1).FullName release/
          node --input-type=module -e "import { readAsarFile } from './scripts/build-identity.mjs'; import { writeFileSync } from 'node:fs'; writeFileSync('release/desktop.build.json', readAsarFile('apps/desktop/release/win-unpacked/resources/app.asar', 'out/build.json'));"
          # Every installer here is bound, so a second one is refused, not chosen between.
          node scripts/release-manifest.mjs bind release desktop @((Get-ChildItem "release/*Setup*.exe").FullName) release/latest.yml @((Get-ChildItem "release/*Setup*.exe.blockmap").FullName)
      - uses: actions/upload-artifact@v7
        with:
          name: release-desktop
          path: release/
          retention-days: 1

  # The Mac app, one disk image for Apple silicon and Intel. The alpha has no
  # Apple Developer ID, so it is signed ad hoc and not notarized; macOS asks
  # people to allow it the first time. The packaged app boots, hosts a
  # workspace, serves the browser client and joins a huddle here first.
  mac:
    needs: [plan]
    if: needs.plan.outputs.build == 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - name: Cache Electron and packaging tools
        uses: actions/cache@v6
        with:
          path: |
            ~/Library/Caches/electron
            ~/Library/Caches/electron-builder
          key: electron-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            electron-${{ runner.os }}-
      - run: pnpm install --frozen-lockfile
      # electron-builder signs nothing in a pull request's build, to keep a
      # certificate out of untrusted code; then the app tested here would not
      # be the app released. An ad hoc signature uses no certificate or secret.
      # Revisit this once a Developer ID certificate signs the app.
      - run: pnpm --filter @ownbase/desktop package --mac --publish never "-c.extraMetadata.version=$OWNBASE_VERSION"
        env:
          CSC_FOR_PULL_REQUEST: "true"
          OWNBASE_VERSION: ${{ needs.plan.outputs.version }}
      - run: node scripts/check-desktop-archive.mjs apps/desktop/release/mac-universal/OwnBase.app/Contents/Resources/app.asar
      - run: node scripts/check-web-precompressed.mjs apps/desktop/release/mac-universal/OwnBase.app/Contents/Resources/web
      - name: Check the app runs on both kinds of Mac and says why it asks
        run: |
          app=apps/desktop/release/mac-universal/OwnBase.app
          archs=$(lipo -archs "$app/Contents/MacOS/OwnBase")
          echo "Architectures: $archs"
          [[ "$archs" == *x86_64* && "$archs" == *arm64* ]] || { echo "::error::not universal: $archs"; exit 1; }
          codesign --verify --deep --strict "$app"
          signature=$(codesign -dv "$app" 2>&1)
          echo "$signature"
          grep -q "Signature=adhoc" <<<"$signature" || { echo "::error::not signed ad hoc"; exit 1; }
          for key in NSMicrophoneUsageDescription NSCameraUsageDescription NSLocalNetworkUsageDescription; do
            /usr/libexec/PlistBuddy -c "Print :$key" "$app/Contents/Info.plist"
          done
      - run: pnpm test:desktop --grep "packaged Mac app"
      - name: Collect the disk image
        run: |
          mkdir -p release
          cp apps/desktop/release/*-universal.dmg release/
          node --input-type=module -e "import { readAsarFile } from './scripts/build-identity.mjs'; import { writeFileSync } from 'node:fs'; writeFileSync('release/mac.build.json', readAsarFile('apps/desktop/release/mac-universal/OwnBase.app/Contents/Resources/app.asar', 'out/build.json'));"
          node scripts/release-manifest.mjs bind release mac release/*-universal.dmg
      - uses: actions/upload-artifact@v7
        with:
          name: release-mac
          path: release/
          retention-days: 1

  # Checks every file was built from this commit and writes the hashes and
  # notes; on a pull request it stops here.
  manifest:
    needs: [plan, server, unit, browser, windows, mac]
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ needs.plan.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: release
          merge-multiple: true
      - run: node --test scripts/release-manifest.test.mjs
      - run: node scripts/release-manifest.mjs release --revision "$GITHUB_SHA" --tag "$TAG" --notes release/notes.md
        env:
          TAG: ${{ needs.plan.outputs.tag }}
      - uses: actions/upload-artifact@v7
        with:
          name: release-manifest
          path: |
            release/SHA256SUMS
            release/notes.md
          retention-days: 1

  publish:
    needs: [manifest]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: release
          merge-multiple: true
      # From main, published at once: that creates the tag at this commit and
      # puts the files on the website. By hand or from a tag, a draft that
      # someone looks over and publishes, which creates the tag for a run by hand.
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.manifest.outputs.tag }}
        run: |
          # Exactly what the manifest checked and summed, and the sums.
          mapfile -t files < <(sed -E 's/^[0-9a-f]{64}  /release\//' release/SHA256SUMS)
          files+=(release/SHA256SUMS)
          prerelease=()
          if [[ "$TAG" == *-* ]]; then prerelease=(--prerelease); fi
          draft=(--draft)
          if [ "$GITHUB_EVENT_NAME" = "push" ] && [ "$GITHUB_REF_TYPE" = "branch" ]; then draft=(); fi
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" "${draft[@]}" "${prerelease[@]}" \
            --target "$GITHUB_SHA" --title "OwnBase $TAG" --notes-file release/notes.md "${files[@]}"
      # The same files on Cloudflare R2 behind dl.ownbase.site, which the
      # website offers instead of GitHub's copy, several times faster in some
      # places (GitHub gave ~480 KB/s in India). Only a release published from
      # main, and only with the bucket's keys; latest.json goes last, so the
      # website never names a file that is not there yet. The release is out
      # by now, so a failure here leaves the website on GitHub's copy.
      - name: Copy the files to dl.ownbase.site
        if: github.event_name == 'push' && github.ref_type == 'branch'
        continue-on-error: true
        env:
          TAG: ${{ needs.manifest.outputs.tag }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_DOWNLOADS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_DOWNLOADS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          # R2 does not take the newer CLI's default checksums.
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
          ENDPOINT: https://35d320dcda363c47cabe859d44e84243.r2.cloudflarestorage.com
          BUCKET: ownbase-downloads
          KEEP: 3
        run: |
          if [ -z "$AWS_ACCESS_KEY_ID" ]; then
            echo "::notice::No R2 keys, so the files are on GitHub only."
            exit 0
          fi
          s3() { aws s3 --endpoint-url "$ENDPOINT" "$@"; }
          mapfile -t names < <(sed -E 's/^[0-9a-f]{64}  //' release/SHA256SUMS)
          names+=(SHA256SUMS)
          # Each under the name GitHub gives it, which has dots for spaces
          # ("OwnBase Setup 0.1.0.exe" is OwnBase.Setup.0.1.0.exe there), since
          # the website matches the copies to GitHub's files by name.
          for name in "${names[@]}"; do
            s3 cp "release/$name" "s3://$BUCKET/$TAG/${name// /.}" --only-show-errors \
              --content-disposition "attachment; filename=\"${name// /.}\"" \
              --cache-control "public, max-age=31536000, immutable"
          done
          node -e '
            const fs = require("node:fs");
            const tag = process.env.TAG;
            const files = {};
            for (const name of process.argv.slice(1)) {
              const key = name.replaceAll(" ", ".");
              files[key] = {
                url: `https://dl.ownbase.site/${tag}/${encodeURIComponent(key)}`,
                size: fs.statSync(`release/${name}`).size,
              };
            }
            fs.writeFileSync("latest.json", JSON.stringify({ tag, files }, null, 1));
          ' "${names[@]}"
          s3 cp latest.json "s3://$BUCKET/latest.json" --only-show-errors \
            --content-type application/json --cache-control "public, max-age=60"
          # The newest few releases stay; storage is the only part R2 bills.
          s3 ls "s3://$BUCKET/" | awk '$1 == "PRE" { sub("/$", "", $2); print $2 }' \
            | grep -E '^v[0-9]' | sort -V | head -n -"$KEEP" \
            | while read -r old; do s3 rm "s3://$BUCKET/$old/" --recursive --only-show-errors; done
          echo "Copied $TAG to https://dl.ownbase.site/$TAG/"

  # The installer and the Mac disk image together are near 300 MB of a
  # half-gigabyte storage allowance, and ci.yml's clean-up leaves release-*
  # alone, so this run deletes its own artifacts once nothing needs them,
  # published or not.
  clean-up:
    needs: [plan, manifest, publish]
    if: ${{ always() && needs.plan.outputs.build == 'true' && !github.event.pull_request.head.repo.fork }}
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Delete this run's artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for id in $(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" --jq '.artifacts[].id'); do
            gh api --method DELETE "repos/$GITHUB_REPOSITORY/actions/artifacts/$id" && echo "Deleted artifact $id" \
              || echo "::warning::Could not delete artifact $id"
          done
