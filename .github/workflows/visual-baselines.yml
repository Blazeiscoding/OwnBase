name: Visual baselines
# Takes the visual check's pictures (tests/visual) on Linux, where Checks
# compares against them, and commits the ones that changed to the branch.
# Start it by adding the "visual baselines" label to a pull request, or from
# the Actions tab on a branch. A commit a workflow pushes starts no checks of
# its own without approval, so this then approves those runs, or starts
# Checks on it where there are none to approve.
#
# Only pictures that no longer match are taken again, so one that still does
# keeps its file. A faint change of colour can still match and leave the old
# look in its file; started from the Actions tab with "Take every picture
# again" ticked, it takes them all. A failure other than a picture, such as
# axe, fails the run and commits nothing; its results are kept for a day, and
# the next Checks run deletes them.
on:
  pull_request:
    types: [labeled]
  workflow_dispatch:
    inputs:
      every:
        description: Take every picture again, not only those that no longer match
        type: boolean
        default: false
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  pictures:
    # A fork's pull request gets a token that cannot push to its branch.
    if: >-
      ${{ github.event_name == 'workflow_dispatch' ||
      (github.event.label.name == 'visual baselines' &&
      !github.event.pull_request.head.repo.fork) }}
    runs-on: ubuntu-latest
    permissions:
      # To push the pictures, start Checks and take the label off again.
      contents: write
      actions: write
      pull-requests: write
    env:
      BRANCH: ${{ github.event.pull_request.head.ref || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.BRANCH }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: 1
      - run: pnpm build --concurrency=2
      - uses: actions/cache/restore@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:visual --update-snapshots=${{ inputs.every && 'all' || 'changed' }}
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: visual-baselines-results
          path: test-results/
          retention-days: 1
      - name: Commit the pictures that changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git add tests/visual/__screenshots__/linux
          if git diff --cached --quiet; then
            echo "Every picture already matches."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "test(visual): take the pictures that changed, on Linux"
          git push origin "HEAD:$BRANCH"
          # GitHub holds the runs a workflow's own push starts until someone
          # approves them. Approve them, so the pull request's checks run as
          # for any push. Where none can be (a branch with no pull request,
          # or the approval is refused), start Checks on the commit instead.
          commit=$(git rev-parse HEAD)
          approved=0
          for attempt in 1 2 3 4 5 6; do
            sleep 10
            held=$(gh run list --commit "$commit" --status action_required --json databaseId --jq '.[].databaseId')
            [ -n "$held" ] || continue
            for id in $held; do
              gh api --method POST "repos/$GITHUB_REPOSITORY/actions/runs/$id/approve" && approved=1
            done
            break
          done
          if [ "$approved" = 0 ]; then gh workflow run ci.yml --ref "$BRANCH"; fi
      - name: Take the label off
        if: ${{ always() && github.event_name == 'pull_request' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr edit "${{ github.event.pull_request.number }}" --repo "$GITHUB_REPOSITORY" --remove-label "visual baselines"
