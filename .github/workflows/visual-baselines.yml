name: Visual baselines
# Takes the visual check's pictures (tests/visual) on Linux, where Checks
# compares against them, and commits the ones that changed to the branch.
# Start it by adding the "visual baselines" label to a pull request, or from
# the Actions tab on a branch. A commit a workflow pushes starts no checks of
# its own, so this then starts Checks on it.
#
# Only pictures that no longer match are taken again, so one that still does
# keeps its file. A failure other than a picture, such as axe, fails the run
# and commits nothing; its results are kept for a day, and the next Checks
# run deletes them.
on:
  pull_request:
    types: [labeled]
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  pictures:
    # A fork's pull request gets a token that cannot push to its branch.
    if: >-
      ${{ github.event_name == 'workflow_dispatch' ||
      (github.event.label.name == 'visual baselines' &&
      !github.event.pull_request.head.repo.fork) }}
    runs-on: ubuntu-latest
    permissions:
      # To push the pictures, start Checks and take the label off again.
      contents: write
      actions: write
      pull-requests: write
    env:
      BRANCH: ${{ github.event.pull_request.head.ref || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.BRANCH }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: 1
      - run: pnpm build --concurrency=2
      - uses: actions/cache/restore@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:visual --update-snapshots
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: visual-baselines-results
          path: test-results/
          retention-days: 1
      - name: Commit the pictures that changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git add tests/visual/__screenshots__/linux
          if git diff --cached --quiet; then
            echo "Every picture already matches."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "test(visual): take the pictures that changed, on Linux"
          git push origin "HEAD:$BRANCH"
          gh workflow run ci.yml --ref "$BRANCH"
      - name: Take the label off
        if: ${{ always() && github.event_name == 'pull_request' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr edit "${{ github.event.pull_request.number }}" --repo "$GITHUB_REPOSITORY" --remove-label "visual baselines"
