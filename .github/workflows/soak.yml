name: Soak
# An hour of steady chat against one server, scripts/measure-soak.mts, to see
# whether anything the server holds keeps growing. Started by hand only, on a
# standard runner (the repository is public, so the minutes are free). The
# results are in the log: one line a minute, then whether each line climbed.
# Nothing is uploaded.
#
# `measure: snapshot` runs scripts/measure-snapshot.mts instead: what the
# handshake costs for a workspace of `members` people and `channels`
# channels, once and for 100 people arriving at once, as after a restart.
on:
  workflow_dispatch:
    inputs:
      minutes:
        description: How long to run, in minutes
        default: "60"
      rate:
        description: How often everyone acts, as a multiple of the script's pace
        default: "1"
      people:
        description: How many people, in blocks of 20 (scripts/soak-cast.mjs)
        default: "20"
      history:
        description: Messages already in the workspace when the run starts
        default: "20000"
      measure:
        description: The soak, or the handshake snapshot alone
        type: choice
        options: [soak, snapshot]
        default: soak
      members:
        description: "Snapshot only: members in the workspace"
        default: "2000"
      channels:
        description: "Snapshot only: public channels in the workspace"
        default: "300"
permissions:
  contents: read
jobs:
  soak:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: 1
      - name: The runner
        run: |
          nproc
          grep -m1 "model name" /proc/cpuinfo
          free -m
          df -h "$RUNNER_TEMP"
      - name: Soak
        if: inputs.measure != 'snapshot'
        env:
          MINUTES: ${{ inputs.minutes }}
          RATE: ${{ inputs.rate }}
          PEOPLE: ${{ inputs.people }}
          HISTORY: ${{ inputs.history }}
        run: >-
          pnpm --filter @ownbase/server exec tsx ../../scripts/measure-soak.mts
          --minutes="$MINUTES" --rate="$RATE" --people="$PEOPLE" --history="$HISTORY"
      - name: Handshake snapshot
        if: inputs.measure == 'snapshot'
        env:
          MEMBERS: ${{ inputs.members }}
          CHANNELS: ${{ inputs.channels }}
        run: >-
          pnpm --filter @ownbase/server exec tsx ../../scripts/measure-snapshot.mts
          --members="$MEMBERS" --channels="$CHANNELS"
