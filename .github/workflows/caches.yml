name: Dependency caches
# Checks run on pull requests only; running them again on main after a merge
# repeated a run that had just passed on the same code, and used almost half
# of September's minutes. But a pull request can restore caches made on main
# and nowhere else, so when the lockfile changes this refills the caches the
# checks install from: the pnpm store on both systems, and the Chromium the
# browser tests use on Linux. It does nothing more.
on:
  push:
    branches: [main]
    paths:
      - "pnpm-lock.yaml"
      - ".github/workflows/caches.yml"
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  pnpm-store:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      # Filling the store is the point; setup-node saves it after the job.
      - run: pnpm install --frozen-lockfile
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: 1
      - if: runner.os == 'Linux'
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      # And the Linux packages it needs that the runner image lacks, fonts
      # alone so far, as the files apt downloaded. Each check run hands them
      # to apt (.github/actions/chromium), which installs them without going
      # to Ubuntu's mirror, slow at times.
      - if: runner.os == 'Linux'
        uses: actions/cache@v6
        with:
          path: ~/.cache/playwright-apt
          key: playwright-apt-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - if: runner.os == 'Linux'
        run: |
          echo 'APT::Keep-Downloaded-Packages "true";' | sudo tee /etc/apt/apt.conf.d/99keep-downloads
          sudo rm -f /etc/apt/apt.conf.d/docker-clean
          pnpm exec playwright install --with-deps chromium
          mkdir -p ~/.cache/playwright-apt
          shopt -s nullglob
          debs=(/var/cache/apt/archives/*.deb)
          if [ ${#debs[@]} -gt 0 ]; then cp "${debs[@]}" ~/.cache/playwright-apt/; fi
          echo "Packages kept for the browser tests: ${#debs[@]}"
          ls ~/.cache/playwright-apt
