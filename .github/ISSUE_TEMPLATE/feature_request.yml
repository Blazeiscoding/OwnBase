name: Feature request
description: Something OwnBase should do that it does not do yet.
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Search the open issues first. If someone has asked already, add your case to theirs.
  - type: textarea
    id: problem
    attributes:
      label: What you are trying to do
      description: The task or the moment where OwnBase gets in the way, in your own words.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help
      description: How you picture it working. A rough idea is fine.
    validations:
      required: true
  - type: textarea
    id: today
    attributes:
      label: What you do today instead
      description: A workaround, another app, or nothing.
  - type: dropdown
    id: where
    attributes:
      label: Who it is for
      multiple: true
      options:
        - People chatting in a workspace
        - Whoever runs the workspace (owners and admins)
        - Whoever hosts the server
        - Bots and integrations
