name: Browsers for the browser tests
description: >-
  Installs the browsers the browser tests use, Chromium unless told otherwise,
  and the Linux packages they need, from caches that caches.yml fills on main.
# The runner image already has every library Chromium needs; what it lacks is
# nine font packages, 22 MB, which the visual check's pictures were taken with.
# WebKit and Firefox need many more. Ubuntu's mirror has served those at
# 40 kB/s, which made one install take nine minutes instead of twenty seconds.
# So the packages come from a cache into apt's own download folder, and apt
# fetches only what has a newer version since. Restoring alone leaves no cache
# behind that only one pull request could use.
inputs:
  browsers:
    description: The browsers to install, as `playwright install` takes them.
    default: chromium
  cache:
    description: >-
      The name of the caches caches.yml fills for these browsers:
      playwright for Chromium, playwright-other for WebKit and Firefox.
    default: playwright
runs:
  using: composite
  steps:
    - uses: actions/cache/restore@v6
      with:
        path: ~/.cache/ms-playwright
        key: ${{ inputs.cache }}-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
    # Any earlier copy is better than none: fonts rarely change, and apt
    # checks each file against its index before using it.
    - uses: actions/cache/restore@v6
      with:
        path: ~/.cache/playwright-apt
        key: ${{ inputs.cache }}-apt-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
        restore-keys: ${{ inputs.cache }}-apt-${{ runner.os }}-
    - shell: bash
      env:
        BROWSERS: ${{ inputs.browsers }}
      run: |
        shopt -s nullglob
        debs=("$HOME"/.cache/playwright-apt/*.deb)
        if [ ${#debs[@]} -gt 0 ]; then
          sudo cp "${debs[@]}" /var/cache/apt/archives/
          echo "Restored ${#debs[@]} packages for apt"
        else
          echo "::notice::No cached packages for $BROWSERS; apt downloads them."
        fi
        pnpm exec playwright install --with-deps $BROWSERS
