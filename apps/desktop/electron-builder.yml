appId: dev.ownbase.desktop
productName: OwnBase
# The installed app's own name. A one-click Windows install folder is named
# after it, %LOCALAPPDATA%\Programs\OwnBase; the workspace package's name
# would give "@ownbasedesktop".
extraMetadata:
  name: OwnBase
directories:
  output: release
files:
  - out/**
  - package.json
  # Never loaded at runtime (F15): TypeScript source and declarations inside
  # dependencies. Node does not strip types under node_modules, and zod's
  # "@zod/source" export condition, the only route to its src/, is never set.
  - "!**/node_modules/**/*.{ts,cts,mts}"
asar: true
extraResources:
  - from: ../web/dist
    to: web
  - from: build
    to: tray
    filter:
      - icon.ico
      - icon.png
win:
  icon: build/icon.ico
  target:
    - nsis
nsis:
  oneClick: true
  deleteAppDataOnUninstall: false
mac:
  icon: build/icon-mac.png
  target:
    - dmg
  category: public.app-category.productivity
linux:
  target:
    - AppImage
    - deb
  category: Network
protocols:
  - name: OwnBase
    schemes:
      - ownbase
