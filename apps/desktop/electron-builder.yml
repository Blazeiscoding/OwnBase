appId: dev.ownbase.desktop
productName: OwnBase
# The installed app's own name. A one-click Windows install folder is named
# after it, %LOCALAPPDATA%\Programs\OwnBase; the workspace package's name
# would give "@ownbasedesktop".
extraMetadata:
  name: OwnBase
directories:
  output: release
files:
  - out/**
  - package.json
  # Never loaded at runtime (F15): TypeScript source and declarations inside
  # dependencies. Node does not strip types under node_modules, and zod's
  # "@zod/source" export condition, the only route to its src/, is never set.
  - "!**/node_modules/**/*.{ts,cts,mts}"
asar: true
extraResources:
  - from: ../web/dist
    to: web
  - from: build
    to: tray
    filter:
      - icon.ico
      - icon.png
  # The Windows microphone helper (native/OwnBaseMicrophone.cs), run from
  # outside the archive; scripts/build-microphone.mjs builds it, and leaves
  # the folder empty elsewhere.
  - from: native/bin
    to: native
    filter:
      - ownbase-microphone.exe
win:
  icon: build/icon.ico
  target:
    - nsis
nsis:
  oneClick: true
  deleteAppDataOnUninstall: false
  # No spaces: GitHub turns a space in an uploaded file's name into a dot, and
  # the feed file (latest.yml) must name the installer as it is published.
  artifactName: ${productName}-Setup-${version}.${ext}
# Where the installed app looks for new versions: R2, never GitHub. With a
# provider set, electron-builder writes the feed file (latest.yml) and the
# installer's blockmap beside the installer, and app-update.yml into the app,
# which electron-updater still reads for its download folder. It publishes
# nothing (`--publish never` in the Release workflow): the workflow uploads to
# GitHub and to R2 itself. The app points the updater at the newest release's
# folder, https://dl.ownbase.site/<tag>/, on each look (src/main/updateFeed.ts).
publish:
  provider: generic
  url: https://dl.ownbase.site/
  # Always latest.yml. Without it a generic provider names the feed file after
  # the version's pre-release part (alpha.yml for 0.2.0-alpha.24), which
  # GitHub's provider never did and the app does not look for.
  channel: latest
mac:
  icon: build/icon-mac.png
  # One disk image for Apple silicon and Intel: a browser cannot tell a
  # visitor which their Mac has.
  target:
    - target: dmg
      arch: universal
  category: public.app-category.productivity
  # The alpha has no Apple Developer ID, so it is signed ad hoc, which Apple
  # silicon needs before it runs the app at all; macOS then asks people to
  # allow it once, under Privacy & Security. electron-builder signs nothing
  # without being told to. An ad hoc signature cannot use the hardened
  # runtime without dropping library validation; notarizing will need both.
  identity: "-"
  hardenedRuntime: false
  # What macOS shows when it asks for each permission. A huddle asks for the
  # microphone and the camera; the Join screen and hosting use the local
  # network, where workspaces advertise as _ownbase._tcp.
  extendInfo:
    NSMicrophoneUsageDescription: OwnBase uses your microphone when you join a huddle.
    NSCameraUsageDescription: OwnBase uses your camera when you turn it on in a huddle.
    NSLocalNetworkUsageDescription: OwnBase finds workspaces on your network and lets teammates there join the one you host.
    NSBonjourServices:
      - _ownbase._tcp
linux:
  target:
    - AppImage
    - deb
  category: Network
protocols:
  - name: OwnBase
    schemes:
      - ownbase
